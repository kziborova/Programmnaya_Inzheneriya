<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Parts Unlimited Academy</title>
  <link rel="icon" type="image/png" sizes="64x64" href="assets/academy-book-v1.png">
  <link rel="stylesheet" href="assets/style.css">
  <script src="assets/app.js" defer></script>
</head>
<body>
  <header class="masthead"><div class="wrap"><a class="brand" href="index.html"><img src="assets/academy-book-v1.png" width="32" height="32" alt="">Parts Unlimited Academy</a></div></header>
  <main class="wrap">
    <section aria-labelledby="tutorial-title"><div class="section-intro"><h1 id="tutorial-title">Новые учебники</h1><p>Короткие занятия по программной инженерии с примерами для самостоятельной практики.</p></div><div id="tutorials" class="cards" aria-live="polite">Загрузка…</div></section>
    <div class="tools"><section class="panel" aria-labelledby="recent-title"><h2 id="recent-title">Недавно просмотренные</h2><ol id="recent"><li>Пока ничего нет</li></ol></section>
    <section class="panel" aria-labelledby="request-title"><h2 id="request-title">Запросить новые материалы</h2><form id="request-form"><label for="topic">Тема запроса</label><input id="topic" name="topic" maxlength="100" required placeholder="Например, основы Scrum"><button type="submit">Сохранить запрос</button></form><p id="request-message" role="status"></p><p class="hint">Запрос сохранится в этом браузере.</p></section></div>
  </main>
  <footer><div class="wrap">Лабораторный проект · GitHub Projects + GitHub Actions</div></footer>
</body>
</html>
