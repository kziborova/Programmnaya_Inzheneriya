name: CI - тесты и сборка
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Build
        run: python scripts/build_site.py
      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: parts-unlimited-site
          retention-days: 1
          path: dist/
          if-no-files-found: error
